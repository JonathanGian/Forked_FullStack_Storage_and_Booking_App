[build]
  command = "npm ci --include=dev && npm --prefix common ci --include=dev && npm --prefix frontend ci --include=dev && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
